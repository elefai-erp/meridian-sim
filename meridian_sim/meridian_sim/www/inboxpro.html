{% extends "templates/web.html" %}

{% block title %}InboxPro{% endblock %}

{% block page_content %}
<style>
  .navbar, .web-footer, footer { display: none !important; }
  body { background: #f6f8fc; }
  .ip-wrap { max-width: 1200px; margin: 0 auto; padding: 16px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .ip-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .ip-logo { font-size: 20px; font-weight: 700; color: #d93025; }
  .ip-logo span { color: #444; font-weight: 400; }
  .ip-sim { background: #fff3cd; color: #7a5b00; border: 1px solid #e6cf7a; font-size: 11px;
    padding: 2px 10px; border-radius: 999px; font-weight: 600; }
  .ip-back { margin-left: auto; font-size: 13px; }
  .ip-bar { display: flex; gap: 8px; margin-bottom: 10px; }
  .ip-btn { border: 1px solid #dadce0; background: #fff; border-radius: 20px; padding: 6px 16px;
    font-size: 13px; cursor: pointer; }
  .ip-btn.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  .ip-btn.active { background: #e8f0fe; border-color: #1a73e8; color: #1a73e8; }
  .ip-main { display: grid; grid-template-columns: 360px 1fr; gap: 12px; }
  @media (max-width: 800px) { .ip-main { grid-template-columns: 1fr; } }
  .ip-list { background: #fff; border: 1px solid #e3e7ee; border-radius: 10px; overflow: auto; max-height: 74vh; }
  .ip-item { padding: 12px 14px; border-bottom: 1px solid #f0f2f5; cursor: pointer; }
  .ip-item:hover { background: #f6f8fc; }
  .ip-item.sel { background: #e8f0fe; }
  .ip-item .from { font-size: 13.5px; color: #202124; }
  .ip-item.unread .from, .ip-item.unread .subj { font-weight: 700; }
  .ip-item .subj { font-size: 13px; color: #3c4043; }
  .ip-item .when { font-size: 11px; color: #80868b; float: right; }
  .ip-read { background: #fff; border: 1px solid #e3e7ee; border-radius: 10px; padding: 20px; max-height: 74vh; overflow: auto; }
  .ip-read h3 { margin: 0 0 6px; font-size: 18px; color: #202124; }
  .ip-meta { font-size: 12.5px; color: #5f6368; margin-bottom: 14px; }
  .ip-body { font-size: 14px; color: #202124; white-space: pre-wrap; line-height: 1.55; }
  .ip-reply { margin-top: 18px; border-top: 1px solid #eee; padding-top: 14px; display: none; }
  .ip-reply textarea, .ip-compose input, .ip-compose textarea { width: 100%; border: 1px solid #dadce0;
    border-radius: 8px; padding: 8px 10px; font-size: 13.5px; margin-bottom: 8px; font-family: inherit; }
  .ip-empty { color: #80868b; font-size: 14px; padding: 40px; text-align: center; }
  .ip-compose { display: none; }
</style>

<div class="ip-wrap">
  <div class="ip-top">
    <div class="ip-logo">Inbox<span>Pro</span></div>
    <span class="ip-sim">TRAINING SIMULATION</span>
    <a class="ip-back" href="/mydesk">&larr; My Desk</a>
  </div>
  <div class="ip-bar">
    <button class="ip-btn primary" onclick="ipCompose()">&#9998; Compose</button>
    <button class="ip-btn active" id="tab-Inbox" onclick="ipFolder('Inbox')">Inbox</button>
    <button class="ip-btn" id="tab-Sent" onclick="ipFolder('Sent')">Sent</button>
  </div>

  <div class="ip-main">
    <div class="ip-list" id="ip-list"><div class="ip-empty">Loading&hellip;</div></div>

    <div class="ip-read" id="ip-read">
      <div class="ip-empty" id="ip-placeholder">Select an email to read it</div>

      <div id="ip-message" style="display:none">
        <h3 id="r-subject"></h3>
        <div class="ip-meta" id="r-meta"></div>
        <div class="ip-body" id="r-body"></div>
        <div style="margin-top:16px">
          <button class="ip-btn" onclick="ipShowReply()">&#8617; Reply</button>
        </div>
        <div class="ip-reply" id="ip-reply">
          <textarea id="reply-body" rows="5" placeholder="Write your reply&hellip;"></textarea>
          <button class="ip-btn primary" onclick="ipSendReply()">Send</button>
        </div>
      </div>

      <div class="ip-compose" id="ip-compose">
        <h3>New message</h3>
        <input id="c-to" placeholder="To (email)">
        <input id="c-subject" placeholder="Subject">
        <textarea id="c-body" rows="8" placeholder="Message&hellip;"></textarea>
        <button class="ip-btn primary" onclick="ipSendNew()">Send</button>
        <button class="ip-btn" onclick="ipCancelCompose()">Discard</button>
      </div>
    </div>
  </div>
</div>

<script>
var ipState = { folder: "Inbox", current: null };
function esc(s) { var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

function ipFolder(f) {
  ipState.folder = f;
  document.getElementById("tab-Inbox").classList.toggle("active", f === "Inbox");
  document.getElementById("tab-Sent").classList.toggle("active", f === "Sent");
  ipLoad();
}

function ipLoad() {
  frappe.call({
    method: "meridian_sim.api.inbox_list",
    args: { folder: ipState.folder },
    callback: function (r) {
      var list = document.getElementById("ip-list");
      var rows = r.message || [];
      if (!rows.length) { list.innerHTML = '<div class="ip-empty">Nothing here</div>'; return; }
      list.innerHTML = rows.map(function (m) {
        var who = ipState.folder === "Sent" ? ("To: " + esc(m.to_email)) : esc(m.sender);
        var when = (m.received_at || "").slice(5, 16);
        return '<div class="ip-item ' + (m.is_read ? "" : "unread") + '" data-name="' + m.name + '" onclick="ipOpen(this)">' +
          '<span class="when">' + when + '</span>' +
          '<div class="from">' + who + '</div>' +
          '<div class="subj">' + esc(m.subject) + '</div></div>';
      }).join("");
    }
  });
}

function ipOpen(el) {
  var name = el.getAttribute("data-name");
  document.querySelectorAll(".ip-item").forEach(function (i) { i.classList.remove("sel"); });
  el.classList.add("sel"); el.classList.remove("unread");
  frappe.call({
    method: "meridian_sim.api.email_get",
    args: { name: name },
    callback: function (r) {
      var m = r.message; ipState.current = m;
      document.getElementById("ip-placeholder").style.display = "none";
      document.getElementById("ip-compose").style.display = "none";
      document.getElementById("ip-message").style.display = "block";
      document.getElementById("ip-reply").style.display = "none";
      document.getElementById("r-subject").innerHTML = esc(m.subject);
      document.getElementById("r-meta").innerHTML = esc(m.sender) + " &lt;" + esc(m.sender_email) + "&gt; &middot; " + esc(m.received_at);
      document.getElementById("r-body").innerHTML = esc(m.body);
    }
  });
}

function ipShowReply() { document.getElementById("ip-reply").style.display = "block"; }

function ipSendReply() {
  var m = ipState.current;
  var body = document.getElementById("reply-body").value.trim();
  if (!m || !body) return;
  frappe.call({
    method: "meridian_sim.api.email_send",
    args: { to_email: m.sender_email, subject: "Re: " + m.subject, body: body, reply_to: m.name },
    callback: function () {
      document.getElementById("reply-body").value = "";
      document.getElementById("ip-reply").style.display = "none";
      frappe.msgprint ? frappe.msgprint("Reply sent") : alert("Reply sent");
    }
  });
}

function ipCompose() {
  document.getElementById("ip-placeholder").style.display = "none";
  document.getElementById("ip-message").style.display = "none";
  document.getElementById("ip-compose").style.display = "block";
}
function ipCancelCompose() {
  document.getElementById("ip-compose").style.display = "none";
  document.getElementById("ip-placeholder").style.display = "block";
}
function ipSendNew() {
  var to = document.getElementById("c-to").value.trim();
  var subject = document.getElementById("c-subject").value.trim();
  var body = document.getElementById("c-body").value.trim();
  if (!to || !subject || !body) return;
  frappe.call({
    method: "meridian_sim.api.email_send",
    args: { to_email: to, subject: subject, body: body },
    callback: function () {
      ipCancelCompose();
      ["c-to", "c-subject", "c-body"].forEach(function (i) { document.getElementById(i).value = ""; });
      ipFolder("Sent");
    }
  });
}

frappe.ready(function () { ipLoad(); });
</script>
{% endblock %}
