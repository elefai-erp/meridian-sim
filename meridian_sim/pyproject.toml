[project]
name = "meridian_sim"
authors = [{ name = "Meridian Sim Contributors" }]
description = "Simulation layer for Meridian Sim — story clock, consequence engine, world generation, mock sites, and AI appraisal, running alongside ERPNext and Frappe HR"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "AGPL-3.0" }
dynamic = ["version"]
dependencies = [
    # frappe/erpnext/hrms are bench-installed, never pip dependencies
    "pyyaml",
    "jsonschema",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"
